name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload
        required: false
        type: string
  push:
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:

  validation:
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

  build:
    needs: validation
    strategy:
      matrix:
        # Include amd64 on all platforms.
        goos: [windows, freebsd, linux, darwin]
        goarch: [amd64, 386]
        exclude:
          # Exclude i386 on darwin.
          - goarch: 386
            goos: darwin
        include:
          # BEIGIN MacOS ARM64
          - goos: darwin
            goarch: arm64
          # END MacOS ARM64
          # BEGIN Linux ARM 5 6 7
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 5
          # END Linux ARM 5 6 7
          # BEGIN Android ARM 8
          - goos: android
            goarch: arm64
          # END Android ARM 8
          # BEGIN Other architectures
          # BEGIN riscv64 & ARM64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          # END riscv64 & ARM64
          # BEGIN MIPS
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips
          # END MIPS
          # BEGIN PPC
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          # END PPC
          # BEGIN FreeBSD ARM
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: arm
            goarm: 7
          # END FreeBSD ARM
          # BEGIN S390X
          - goos: linux
            goarch: s390x
          # END S390X
          # END Other architectures
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.source_sha }}
      - name: Show workflow information
        id: get_filename
        run: |
          export _NAME=$(jq ".[\"$GOOS-$GOARCH$GOARM$GOMIPS\"].friendlyName" -r < .github/build/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, GOMIPS: $GOMIPS, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Get project dependencies
        run: |
          go mod download
      - name: Get release version
        if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_ENV"
      - name: Get other version
        if: ${{ inputs.release_tag == '' && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "version=${{ github.sha }}" >> $GITHUB_ENV
      - name: Build V2bX
        run: |
          echo "version: $version"
          mkdir -p build_assets
          GOEXPERIMENT=jsonv2 go build -v -o build_assets/V2bX -tags "http2legacy sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -ldflags "-X 'github.com/InazumaV/V2bX/cmd.version=$version' -s -w -buildid="

      - name: Build Mips softfloat V2bX
        if: matrix.goarch == 'mips' || matrix.goarch == 'mipsle'
        run: |
          echo "version: $version"
          GOEXPERIMENT=jsonv2 GOMIPS=softfloat go build -v -o build_assets/V2bX_softfloat -tags "http2legacy sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -ldflags "-X 'github.com/InazumaV/V2bX/cmd.version=$version' -s -w -buildid="
      - name: Rename Windows V2bX
        if: matrix.goos == 'windows'
        run: |
          cd ./build_assets || exit 1
          mv V2bX V2bX.exe
      - name: Prepare to release
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE
          mkdir -p ./build_assets/third_party_licenses
          cp ${GITHUB_WORKSPACE}/third_party/README.md ./build_assets/third_party_licenses/README.md
          cp ${GITHUB_WORKSPACE}/third_party/sing-box/LICENSE ./build_assets/third_party_licenses/sing-box-LICENSE
          cp ${GITHUB_WORKSPACE}/third_party/quic-go/LICENSE ./build_assets/third_party_licenses/quic-go-LICENSE
          cp ${GITHUB_WORKSPACE}/docs/security-mptcp.md ./build_assets/SECURITY-MPTCP.md
          cp ${GITHUB_WORKSPACE}/docs/upstream-integration.md ./build_assets/UPSTREAM-INTEGRATION.md
          cp ${GITHUB_WORKSPACE}/scripts/mitigate-mptcp.sh ./build_assets/mitigate-mptcp.sh
          cp ${GITHUB_WORKSPACE}/docs/accesslog.md ./build_assets/ACCESSLOG.md
          cp ${GITHUB_WORKSPACE}/scripts/upgrade-accesslog.sh ./build_assets/upgrade-accesslog.sh
          cp ${GITHUB_WORKSPACE}/example/*.json ./build_assets/
          LIST=('geoip' 'geosite')
          for i in "${LIST[@]}"
          do
            DOWNLOAD_URL="https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/${i}.dat"
            FILE_NAME="${i}.dat"
            echo -e "Downloading ${DOWNLOAD_URL}..."
            curl --fail --location --retry 3 "${DOWNLOAD_URL}" -o ./build_assets/${FILE_NAME}
          done
      - name: Create ZIP archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../V2bX-$ASSET_NAME.zip .
          popd || exit 1
          FILE="V2bX-$ASSET_NAME.zip"
          DGST=$FILE.dgst
          sha256sum "$FILE" > "$FILE.sha256"
          CHECKSUM_NAME=$(awk 'NR == 1 { print $2 }' "$FILE.sha256")
          [[ "$CHECKSUM_NAME" == "$FILE" ]] || {
            echo "Checksum sidecar must contain the release asset basename"
            exit 1
          }
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done
      - name: Change the name
        run: |
          mv build_assets V2bX-$ASSET_NAME
      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: V2bX-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: |
            ./V2bX-${{ steps.get_filename.outputs.ASSET_NAME }}/*
      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: ./V2bX-${{ steps.get_filename.outputs.ASSET_NAME }}.zip*
          if-no-files-found: error
          retention-days: 7

  release-upload:
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
    needs: [validation, build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.source_sha }}
          fetch-depth: 0
      - name: Download verified release bundles
        uses: actions/download-artifact@v8
        with:
          pattern: release-bundle-*
          path: release-assets
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          VALIDATED_SHA: ${{ needs.validation.outputs.source_sha }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*.zip*)
          if (( ${#assets[@]} != 69 )); then
            echo "Expected 69 archive/checksum/digest assets, found ${#assets[@]}"
            exit 1
          fi
          (cd release-assets && sha256sum -c ./*.sha256)
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ $(git rev-parse "refs/tags/$RELEASE_TAG^{commit}") == "$VALIDATED_SHA" ]]
          notes="docs/releases/$RELEASE_TAG.md"
          test -f "$notes"
          # The helper is version-pinned; a new release requires reviewing it.
          grep -Fqx "release='$RELEASE_TAG'" scripts/update-security.sh
          cp scripts/{upgrade-security,update-security}.sh release-assets/
          (cd release-assets && sha256sum upgrade-security.sh > upgrade-security.sh.sha256)
          (cd release-assets && sha256sum update-security.sh > update-security.sh.sha256)
          (cd release-assets && sha256sum ./*.zip* ./*.sh ./*.sh.sha256 > SHA256SUMS)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > release-state.json; then
            # Published releases are immutable here, including on reruns.
            jq -e '.isDraft == true' release-state.json
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --latest=false \
              --title "V2bX $RELEASE_TAG" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          uploaded=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          [[ "$uploaded" == 74 ]]
          # Read back all draft attachments before making the release public.
          mkdir release-readback
          gh release download "$RELEASE_TAG" --dir release-readback --repo "$GITHUB_REPOSITORY"
          cmp release-assets/SHA256SUMS release-readback/SHA256SUMS
          (cd release-readback && sha256sum -c SHA256SUMS)
          gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
