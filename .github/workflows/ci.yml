name: Go validation

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable commit or release tag to validate
        type: string
        required: false
    outputs:
      source_sha:
        description: Commit that passed validation
        value: ${{ jobs.validate.outputs.source_sha }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accounting:
    uses: ./.github/workflows/vision-accounting.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      GOEXPERIMENT: jsonv2
      GOFLAGS: -tags=http2legacy,sing,xray,hysteria2,with_quic,with_grpc,with_utls,with_wireguard,with_acme,with_gvisor
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Record validated source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' ':!:third_party/**'))
          if [[ -n "$unformatted" ]]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
          git diff --check
      - name: Run full test suite
        run: go test ./...
      - name: Verify QUIC trailer security backport
        run: go test github.com/sagernet/quic-go/http3
      - name: Verify local fork archive and DNS response security
        run: go test github.com/sagernet/sing-box/experimental/clashapi github.com/sagernet/sing-box/dns/transport/quic
      - name: Run focused race suite
        run: go test -race ./api/panel ./common/counter ./common/task ./common/accesslog ./conf ./core ./limiter ./node ./core/hy2 ./core/sing ./core/xray/app/dispatcher
      - name: Run bounded localhost proxy stress
        env:
          GOMAXPROCS: '2'
          V2BX_STRESS_ISOLATE_CLIENTS: '1'
          V2BX_STRESS: '1'
          V2BX_STRESS_SECONDS: '8'
          V2BX_STRESS_CONCURRENCY: '32'
          V2BX_STRESS_CHURN_RPS: '1000'
          V2BX_STRESS_IDLE_SECONDS: '5'
          V2BX_STRESS_REPORT: ${{ github.workspace }}/proxy-stress.json
        run: go test -count=1 -timeout 3m -run '^TestProxyStress$' -v ./limiter
      - name: Run 128-client persistent burst and paced churn
        env:
          GOMAXPROCS: '2'
          V2BX_STRESS_ISOLATE_CLIENTS: '1'
          V2BX_STRESS: '1'
          V2BX_STRESS_SECONDS: '3'
          V2BX_STRESS_CONCURRENCY: '128'
          V2BX_STRESS_REPORT: ${{ github.workspace }}/proxy-stress-burst.json
        run: go test -count=1 -timeout 3m -run '^TestProxyStress$' -v ./limiter
      - name: Repeat paced Hysteria2 churn without restarting the node
        env:
          GOMAXPROCS: '2'
          V2BX_STRESS_ISOLATE_CLIENTS: '1'
          V2BX_STRESS: '1'
          V2BX_STRESS_SECONDS: '3'
          V2BX_STRESS_CONCURRENCY: '128'
          V2BX_STRESS_ROUNDS: '5'
          V2BX_STRESS_REPORT: ${{ github.workspace }}/proxy-churn-repeat.json
        run: go test -count=1 -timeout 3m -run '^TestProxyStress/hysteria2/churn$' -v ./limiter
      - name: Observe natural memory recovery with nodes running
        env:
          GOMAXPROCS: '2'
          V2BX_STRESS_ISOLATE_CLIENTS: '1'
          V2BX_STRESS: '1'
          V2BX_STRESS_SECONDS: '3'
          V2BX_STRESS_CONCURRENCY: '32'
          V2BX_STRESS_IDLE_SECONDS: '180'
          V2BX_STRESS_REPORT: ${{ github.workspace }}/proxy-memory-natural.json
        run: go test -count=1 -timeout 12m -run '^TestProxyStress$/.*/churn$' -v ./limiter
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-proxy-stress
          path: |
            proxy-stress.json
            proxy-stress-burst.json
            proxy-churn-repeat.json
            proxy-memory-natural.json
          if-no-files-found: warn
      - name: Verify upgrade and rollback
        run: |
          bash -n scripts/upgrade-accesslog.sh
          sudo env PATH="$PATH" bash scripts/tests/upgrade-accesslog-test.sh
          bash -n scripts/upgrade-security.sh
          bash -n scripts/mitigate-mptcp.sh
          python3 scripts/tests/upgrade-security-test.py
          bash -n scripts/update-security.sh
          python3 scripts/tests/update-security-test.py
      - name: Run vet
        run: go vet ./...
