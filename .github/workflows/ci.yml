name: Go validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [[ -n "$unformatted" ]]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
          git diff --check
      - name: Run full test suite
        run: go test ./...
      - name: Run focused race suite
        run: go test -race ./common/accesslog ./limiter ./node ./core/hy2 ./core/sing ./core/xray/app/dispatcher
      - name: Verify upgrade and rollback
        run: |
          bash -n scripts/upgrade-accesslog.sh
          sudo env PATH="$PATH" bash scripts/tests/upgrade-accesslog-test.sh
      - name: Run vet
        run: go vet ./...
