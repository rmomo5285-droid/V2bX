name: Go validation

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOEXPERIMENT: jsonv2
      GOFLAGS: -tags=http2legacy,sing,xray,hysteria2,with_quic,with_grpc,with_utls,with_wireguard,with_acme,with_gvisor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' ':!:third_party/**'))
          if [[ -n "$unformatted" ]]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
          git diff --check
      - name: Run full test suite
        run: go test ./...
      - name: Verify QUIC trailer security backport
        run: go test github.com/sagernet/quic-go/http3
      - name: Run focused race suite
        run: go test -race ./api/panel ./common/counter ./common/task ./common/accesslog ./conf ./core ./limiter ./node ./core/hy2 ./core/sing ./core/xray/app/dispatcher
      - name: Run bounded localhost proxy stress
        env:
          V2BX_STRESS: '1'
          V2BX_STRESS_SECONDS: '8'
          V2BX_STRESS_CONCURRENCY: '32'
          V2BX_STRESS_CHURN_RPS: '1000'
          V2BX_STRESS_IDLE_SECONDS: '5'
          V2BX_STRESS_REPORT: ${{ github.workspace }}/proxy-stress.json
        run: go test -count=1 -timeout 3m -run '^TestProxyStress$' -v ./limiter
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-proxy-stress
          path: proxy-stress.json
          if-no-files-found: warn
      - name: Verify upgrade and rollback
        run: |
          bash -n scripts/upgrade-accesslog.sh
          sudo env PATH="$PATH" bash scripts/tests/upgrade-accesslog-test.sh
          bash -n scripts/upgrade-security.sh
          bash -n scripts/mitigate-mptcp.sh
          python3 scripts/tests/upgrade-security-test.py
      - name: Run vet
        run: go vet ./...
