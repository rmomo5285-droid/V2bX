name: Verify live Vision download accounting

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable commit or release tag to validate
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-vision-accounting
  cancel-in-progress: true

jobs:
  accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain-vless
            flow: ''
            splice: auto
          - name: vision-auto
            flow: xtls-rprx-vision
            splice: auto
          - name: vision-no-splice
            flow: xtls-rprx-vision
            splice: disable
    env:
      GOEXPERIMENT: jsonv2
      GOFLAGS: -tags=http2legacy,sing,xray,hysteria2,with_quic,with_grpc,with_utls,with_wireguard,with_acme,with_gvisor
      V2BX_ACCOUNTING: '1'
      V2BX_ACCOUNTING_FLOW: ${{ matrix.flow }}
      XRAY_BUF_SPLICE: ${{ matrix.splice }}
      V2BX_ACCOUNTING_REPORT: ${{ github.workspace }}/accounting-${{ matrix.name }}.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Record source and validate formatting
        run: |
          git rev-parse HEAD
          test -z "$(gofmt -l limiter/vision_accounting_test.go core/xray/app/dispatcher/default.go core/xray/app/dispatcher/accounting_test.go)"
          git diff --check
      - name: Verify both dispatcher entry points and counter drains
        run: go test -count=1 -race ./common/counter ./core/xray/app/dispatcher
      - name: Verify Linux partial-write accounting in the splice dependency
        run: go test -count=1 -run '^TestSplicePartialWriteCounters$' github.com/sagernet/sing/common/bufio
      - name: Install syscall tracing for the optimized path
        if: matrix.name == 'vision-auto'
        run: sudo apt-get update -qq && sudo apt-get install -y strace
      - name: Download over a real TLS VLESS connection and capture HTTP pushes
        shell: bash
        run: |
          set -o pipefail
          if [[ '${{ matrix.name }}' == vision-auto ]]; then
            go test -c -o accounting.test ./limiter
            strace -f -e trace=splice -o accounting-syscalls.log ./accounting.test -test.timeout=90s -test.run='^TestVisionDownloadAccounting$' -test.v 2>&1 | tee accounting-${{ matrix.name }}.log
            grep -E 'splice\(.*= [1-9][0-9]*' accounting-syscalls.log > accounting-positive-splice.log
            test -s accounting-positive-splice.log
          else
            go test -count=1 -timeout 90s -run '^TestVisionDownloadAccounting$' -v ./limiter 2>&1 | tee accounting-${{ matrix.name }}.log
          fi
      - name: Publish reproducible measurements in the check result
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          report = Path(os.environ['V2BX_ACCOUNTING_REPORT'])
          if report.exists():
              data = json.loads(report.read_text())
              measurements = json.dumps(data, separators=(',', ':'))
              print('::notice title=Vision accounting measurements::' + measurements)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('```json\n' + json.dumps(data, indent=2) + '\n```\n')
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vision-accounting-${{ matrix.name }}
          path: |
            accounting-${{ matrix.name }}.*
            accounting-syscalls.log
            accounting-positive-splice.log
          if-no-files-found: warn
